name: "🐛 Bug 报告"
description: "报告一个 Bug"
title: "🐛 [Bug]: "
labels: ["bug"]
assignees: []
body:
  - type: markdown
    attributes:
      value: "感谢您报告 Bug！请提供以下信息以便我们快速定位问题。"
  - type: input
    id: version
    attributes:
      label: "ZeroClaw Desktop 版本"
      placeholder: "例如: v1.0.0"
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: "操作系统"
      placeholder: "例如: macOS 14.0 / Windows 11 / Ubuntu 22.04"
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: "重现步骤"
      description: "详细描述如何重现问题"
      placeholder: |
        1. 打开应用
        2. 点击某个按钮
        3. 观察到错误
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: "预期结果"
      placeholder: "描述你期望发生的事情"
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: "实际结果"
      placeholder: "描述实际发生的事情"
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: "日志/截图"
      description: "如果适用，添加日志或截图"
      placeholder: "将日志或截图粘贴在这里"
  - type: textarea
    id: additional
    attributes:
      label: "额外信息"
      placeholder: "任何其他相关信息"
