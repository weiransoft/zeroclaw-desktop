name: "✨ 功能请求"
description: "请求一个新功能"
title: "✨ [Feature]: "
labels: ["feature"]
assignees: []
body:
  - type: markdown
    attributes:
      value: "感谢您提出新功能！请提供以下信息以便我们评估这个功能。"
  - type: textarea
    id: description
    attributes:
      label: "功能描述"
      placeholder: "清晰简洁地描述功能"
    validations:
      required: true
  - type: textarea
    id: use-case
    attributes:
      label: "使用场景"
      placeholder: "为什么需要这个功能"
    validations:
      required: true
  - type: textarea
    id: implementation
    attributes:
      label: "实现建议"
      placeholder: "如果有想法，可以提供实现方案"
  - type: textarea
    id: impact
    attributes:
      label: "影响范围"
      placeholder: "可能影响的模块"
  - type: textarea
    id: additional
    attributes:
      label: "额外信息"
      placeholder: "任何其他相关信息"
